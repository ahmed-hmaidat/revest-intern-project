<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=email], input[type=date], input[type=number], select { 
width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Hotel Reservation</h2>

<form>

    <label for="name"><b>Full Name</b></label>
    <input type="text" id="name" name="name" placeholder="Enter full name" required>

    <label for="email"><b>Email Address</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. guest@example.com" required>

    <label for="checkin"><b>Check-in Date</b></label>
    <input type="date" id="checkin" name="checkin" required>

    <label for="checkout"><b>Check-out Date</b></label>
    <input type="date" id="checkout" name="checkout" required>

    <label for="guests"><b>Number of Guests (1-6)</b></label>
    <input type="number" id="guests" name="guests" min="1" max="6" placeholder="Guests (1 to 6)" required>

    <label for="room"><b>Room Type</b></label>
    <select id="room" name="room" required>
      <option value="" disabled selected>-- Select Room Type --</option>
      <option value="single">Single Room</option>
      <option value="double">Double Room</option>
      <option value="suite">Suite</option>
      <option value="family">Family Room</option>
    </select>

    <input type="submit" value="Reserve Hotel">
  </form>
</div>

</body>
</html>
