<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=email], input[type=password], input[type=date], select { 
width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}
.checkbox-container {
  margin-top: 8px;
  margin-bottom: 20px;
}

.checkbox-container input {
  margin-right: 8px;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>University Registration</h2>

<form>

    <label for="fullname"><b>Full Name</b></label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required>

    <label for="studentid"><b>Student ID</b></label>
    <input type="text" id="studentid" name="studentid" pattern="[0-9]{8}" minlength="8" maxlength="8" title="Student ID must be exactly 8 digits" placeholder="e.g. 20231234" required>

    <label for="email"><b>Email Address</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. student@university.edu" required>

    <label for="password"><b>Password</b></label>
    <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>

    <label for="dob"><b>Date of Birth</b></label>
    <input type="date" id="dob" name="dob" required>

    <label for="department"><b>Department</b></label>
    <select id="department" name="department" required>
      <option value="" disabled selected>-- Select Department --</option>
      <option value="cs">Computer Science</option>
      <option value="ds_ai">Data Science & AI</option>
      <option value="se">Software Engineering</option>
      <option value="ce">Computer Engineering</option>
    </select>

    <div class="checkbox-container">
      <label for="rules">
        <input type="checkbox" id="rules" name="rules" required>
        I agree to the university rules and conditions
      </label>
    </div>

    <input type="submit" value="Register Student">
  </form>
</div>

</body>
</html>
