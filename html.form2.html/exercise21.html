<!DOCTYPE html>
<html>
<head>
<style>

input[type=text]{
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Username (Lowercase Only)</h2>

<p>Please enter a username using lowercase letters only (a-z).</p>

<form>
<label for="username"><b>Username</b></label>
    <input type="text" id="username" name="username" pattern="[a-z]+" title="Only lowercase letters are allowed (e.g., kamal)" placeholder="e.g. kamal" required>

    <input type="submit" value="Submit Username">
</form>
</div>


</body>
</html>
