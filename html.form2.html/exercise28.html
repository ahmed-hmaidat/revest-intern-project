<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=email], input[type=tel], input[type=number]{ 
width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Online Shopping Checkout</h2>

<form>
    <label for="name"><b>Full Name</b></label>
    <input type="text" id="name" name="name" placeholder="Enter full name" required>

    <label for="address"><b>Shipping Address</b></label>
    <input type="text" id="address" name="address" placeholder="Enter street address" required>

    <label for="email"><b>Email Address</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. kamal@example.com" required>

    <label for="phone"><b>Phone Number</b></label>
    <input type="tel" id="phone" name="phone" placeholder="e.g. 0791234567" required>

    <label for="zip"><b>ZIP Code</b></label>
    <input type="text" id="zip" name="zip" pattern="[0-9]{5}" title="ZIP code must be exactly 5 digits" placeholder="e.g. 11110" required>

    <label for="quantity"><b>Quantity (1-20)</b></label>
    <input type="number" id="quantity" name="quantity" min="1" max="20" placeholder="1 to 20" required>

    <label for="coupon"><b>Coupon Code (Optional)</b></label>
    <input type="text" id="coupon" name="coupon" placeholder="Enter promo code">

    <input type="submit" value="Complete Checkout">
  </form>
</div>

</body>
</html>
