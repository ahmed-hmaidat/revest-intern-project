<!DOCTYPE html>
<html>
<body>

<h1>Enter Your Username</h1>

<p>You should enter at least 5 characters and less than 16 characters.</p>

<div class="container">
  <form>
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter Username (5-15 characters)" minlength="5" maxlength="15" required>

    <input type="submit" value="Submit">
  </form>
</div>

</body>
</html>
