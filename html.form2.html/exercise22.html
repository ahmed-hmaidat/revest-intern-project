<!DOCTYPE html>
<html>
<head>
<style>

input[type=tel]{
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Phone Number</h2>

<p>Please enter your phone number (Must be exactly 10 digits).</p>

<form>

<label for="phone"><b>Phone Number</b></label>

<input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Please enter exactly 10 digits (e.g. 0791234567)" placeholder="e.g. 0791234567" required>

    <input type="submit" value="Submit Phone">
</form>
</div>


</body>
</html>
