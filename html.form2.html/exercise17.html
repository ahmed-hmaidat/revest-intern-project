<!DOCTYPE html>
<html>
<head>
<style>

input[type=email], input[type=tel] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

</style>
</head>
<body>


<div class="container">
  
  <h2>  Employee Contact </h2>
  
  <form>
<label for="email"><b>Email Address </b></label>
<input type="email" id="email" name="email" placeholder="e.g. kamal@revest.com" required>

<label for="phone"><b>Phone Number</b></label>
<input type="tel" id="phone" name="phone" placeholder="e.g. +9627XXXXXXXX" required>
    <input type="submit" value="Submit">
  </form>
</div>


</body>
</html>
