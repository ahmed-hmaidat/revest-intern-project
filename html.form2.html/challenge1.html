<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

input[type=text], input[type=email], input[type=url], input[type=tel], 
input[type=number], input[type=date], select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

.radio-group, .checkbox-group {
  margin-top: 6px;
  margin-bottom: 16px;
}

.radio-group label, .checkbox-group label {
  margin-right: 15px;
  font-weight: normal;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 550px;
  margin: auto;
}

</style>
</head>
<body>

<div class="container">
  <h2>Comprehensive Validation Form</h2>
  
  <form>

    <label for="username"><b>Username (required, 5-15 chars)</b></label>
    <input type="text" id="username" name="username" minlength="5" maxlength="15" placeholder="5 to 15 characters" required>

    <label for="email"><b>Primary Email Address (email)</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. kamal@revest.com" required>

    <label for="alt_emails"><b>Secondary Emails (multiple)</b></label>
    <input type="email" id="alt_emails" name="alt_emails" placeholder="e.g. a@test.com, b@test.com" multiple>

    <label for="website"><b>Portfolio Website (url)</b></label>
    <input type="url" id="website" name="website" placeholder="https://revest.com" required>

    <label for="phone"><b>Phone Number (tel, pattern: 10 digits)</b></label>
    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Must be exactly 10 digits" placeholder="0791234567" required>

    <label for="experience"><b>Experience in Years (number, min:0, max:30, step:2)</b></label>
    <input type="number" id="experience" name="experience" min="0" max="30" step="2" placeholder="Even numbers only (0, 2, 4...)" required>

    <label for="startdate"><b>Start Date (date)</b></label>
    <input type="date" id="startdate" name="startdate" required>

    <label for="role"><b>Role (select)</b></label>
    <select id="role" name="role" required>
      <option value="" disabled selected>-- Select Role --</option>
      <option value="dev">Developer</option>
      <option value="designer">Designer</option>
    </select>

    <label><b>Employment Status (radio)</b></label>
    <div class="radio-group">
      <label><input type="radio" name="status" value="fulltime" required> Full-time</label>
      <label><input type="radio" name="status" value="parttime"> Part-time</label>
    </div>

    <div class="checkbox-group">
      <label>
        <input type="checkbox" id="terms" name="terms" required>
        <b>I accept the terms and conditions (checkbox)</b>
      </label>
    </div>

    <input type="submit" value="Submit Challenge Form">
  </form>
</div>

</body>
</html>
