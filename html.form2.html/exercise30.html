<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=url], input[type=date], textarea {
width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Social Media Profile</h2>

<form>
<label for="username"><b>Username</b></label>
    <input type="text" id="username" name="username" minlength="5" maxlength="20" placeholder="5-20 characters" required>

    <label for="website"><b>Website</b></label>
    <input type="url" id="website" name="website" placeholder="https://example.com" required>

    <label for="bio"><b>Bio</b></label>
    <textarea id="bio" name="bio" rows="4" maxlength="300" placeholder="Write something about yourself (Max 300 characters)..." required></textarea>

    <label for="birthdate"><b>Birth Date</b></label>
    <input type="date" id="birthdate" name="birthdate" required>

    <input type="submit" value="Save Profile">
  </form>
</div>

</body>
</html>
