<!DOCTYPE html>
<html>
<head>
<style>

input[type=number] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

</style>
</head>
<body>


<div class="container">
  
  <h2> Multiples of 10</h2>
  <p>Please enter a numbers that multiple of 10 (e.g., 10, 20, 30, 40...).</p>
  
  <form>
    <label for="multiples"><b>Multiples</b></label>
    <input type="number" id="multiples" name="multiples"  placeholder="Enter (10, 20, 30...)" min="10" step="10"required>

    <input type="submit" value="Submit">
  </form>
</div>


</body>
</html>
