<!DOCTYPE html>
<html>
<body>
<style>
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
  resize: vertical;}
  </style>
<h1>Biography</h1>

<p>Please write a short biography (Maximum 200 characters).</p>

<div class="container">
  <form>
    <label for="bio"><b>Biography</b></label>

    <textarea id="bio" name="bio" rows="6" maxlength="200" placeholder="Tell us about yourself..." required></textarea>

    <input type="submit" value="Submit">
  </form>
</div>

</body>
</html>
