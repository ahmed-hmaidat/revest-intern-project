<!DOCTYPE html>
<html>
<head>
<style>

input[type=email], input[type=url], textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Customer Support</h2>

<p>Please fill out the form below to contact support.</p>

<form>

    <label for="email"><b>Email Address</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. kamal@revest.com" required>

    <label for="website"><b>Company Website</b></label>
    <input type="url" id="website" name="website" placeholder="https://revest.com" required>

<label for="message"><b>Message</b></label>
    <textarea id="message" name="message" rows="5" placeholder="Describe your issue..." required></textarea>

    <input type="submit" value="Send Message">
</form>
</div>


</body>
</html>
