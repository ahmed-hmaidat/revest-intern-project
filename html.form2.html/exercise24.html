<!DOCTYPE html>
<html>
<head>
<style>

input[type=text]{
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Hex Color</h2>

<p>Please enter a valid Hex Color (e.g. #FF0000, #00AA55, #123ABC).</p>

<form>

<label for="hexcolor"><b>Hex Color Code</b></label>
    <input type="text" id="hexcolor" name="hexcolor" pattern="#[a-fA-F0-9]{6}" title="Hex color must start with # followed by 6 hex characters (e.g., #FF0000)" placeholder="e.g. #FF0000" required>

    <input type="submit" value="Submit Color">
</form>
</div>


</body>
</html>
