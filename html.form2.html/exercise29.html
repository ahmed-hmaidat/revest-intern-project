<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=email], input[type=tel], input[type=url], input[type=number], textarea{ 
width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}


</style>
</head>
<body>


<div class="container">
  

<h2>Job Application</h2>

<form>
    <label for="fullname"><b>Full Name</b></label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required>

    <label for="email"><b>Email Address</b></label>
    <input type="email" id="email" name="email" placeholder="e.g. kamal@revest.com" required>

    <label for="phone"><b>Phone Number</b></label>
    <input type="tel" id="phone" name="phone" placeholder="e.g. 0791234567" required>

    <label for="portfolio"><b>Portfolio URL</b></label>
    <input type="url" id="portfolio" name="portfolio" placeholder="https://github.com/kamaljehad28" required>

    <label for="experience"><b>Years of Experience (0-40)</b></label>
    <input type="number" id="experience" name="experience" min="0" max="40" placeholder="e.g. 2" required>

    <label for="coverletter"><b>Cover Letter</b></label>
    <textarea id="coverletter" name="coverletter" rows="5" placeholder="Write a brief cover letter..." required></textarea>

    <input type="submit" value="Submit Application">
  </form>
</div>

</body>
</html>
