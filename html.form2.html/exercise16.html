<!DOCTYPE html>
<html>
<head>
<style>

input[type=text], input[type=url] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
  margin-top: 6px;
  margin-bottom: 16px;
}

input[type=submit] {
  background-color: #04AA6D;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-size: 16px;
}

input[type=submit]:hover {
  background-color: #45a049;
}

.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

</style>
</head>
<body>


<div class="container">
  
  <h2> Company Website</h2>
  
  <form>
<label for="compname"><b>Company Name</b></label>
<input type="text" id="compname" name="compname" placeholder="e.g. Revest" required>

<label for="website"><b>Website</b></label>
<input type="url" id="website" name="website" placeholder="https://revest.com" required>
    <input type="submit" value="Submit">
  </form>
</div>


</body>
</html>
