<!DOCTYPE html>
<html lang="en">
<head>
    <title>Biography</title>
</head>
<body>

    <h2>Biography Form</h2>

    <form>

        <label for="bio">Biography:</label><br>

        <textarea id="bio"
                  name="bio"
                  maxlength="200"
                  rows="10"
                  cols="50"
                  placeholder="Pleas enter your bio in short and detail"
                  required
                  ></textarea>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
