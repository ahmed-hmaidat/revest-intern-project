<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student password </title>
</head>
<body>

    <h2>Student ID and password Form</h2>

    <form>

        <label for="studentid">Student ID:</label><br>

        <input type="text"
               id="studentid"
               name="studentid"
               minlength="8"
               maxlength="8"
               placeholder="Pleas enter your id"
               required>

        <br><br>

           <label for="password">Password:</label><br>

        <input type="password"
               id="password"
               name="password"
               minlength="10"
               maxlength="20"
               placeholder="Pleas enter your password"
               required>

        <br><br>


        <button type="submit">Submit</button>

    </form>

</body>
</html>
