<!DOCTYPE html>
<html>
<head>
    <title>Job Application</title>
</head>
<body>

<h2>Job Application</h2>

<form>

    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" required>
    <br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="phone">Phone:</label><br>
    <input type="tel" id="phone" name="phone" required>
    <br><br>

    <label for="portfolio">Portfolio URL:</label><br>
    <input type="url" id="portfolio" name="portfolio" required>
    <br><br>

    <label for="experience">Years of Experience:</label><br>
    <input type="number" id="experience" name="experience"
           min="0" max="40" required>
    <br><br>

    <label for="coverletter">Cover Letter:</label><br>
    <textarea id="coverletter" name="coverletter"
              rows="6" cols="40" required></textarea>
    <br><br>

    <input type="submit" value="Apply">

</form>

</body>
</html>
