<!DOCTYPE html>
<html lang="en">
<head>
    <title>Customer Support Form</title>
</head>
<body>

<h2>Customer Support</h2>

<form>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="enter email"
        required
    >

    <br><br>

    <label for="website">Website:</label>
    <input
        type="url"
        id="website"
        name="website"
        required
        placeholder="web"
    >

    <br><br>

    <label for="message">Message:</label><br>
    <textarea
        id="message"
        name="message"
        rows="5"
        cols="40"
        required
        placeholder="wrait a message"
    ></textarea>

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
