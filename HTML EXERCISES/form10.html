<!DOCTYPE html>
<html lang="en">
<head>
    <title>Product Code</title>
</head>
<body>

    <h2>Product Code Form</h2>

    <form>

        <label for="code">Product Code:</label><br>

        <input type="text"
               id="code"
               name="code"
               minlength="6"
               maxlength="6"
               placeholder="6 characters"
               required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
