<!DOCTYPE html>
<html>
<head>

</head>
<body>

<form>
    <label for="phone">Phone Number:</label>
    <input type="tel"
           id="phone"
           name="phone"
           pattern="[0-9]{10}"           
           title="Phone number must contain exactly 10 digits"
           placeholder=" your number"

           required>

    <br><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
