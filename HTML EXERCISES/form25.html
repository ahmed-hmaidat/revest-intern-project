<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 25</title>
</head>
<body>

<form>
    <label for="plate">License Plate:</label>
    <input type="text"
           id="plate"
           name="plate"
           pattern="[A-Z]{3}[0-9]{4}"
           title="Enter a license plate in the format ABC1234"
           placeholder="enter your license"
           required>

    <br><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
