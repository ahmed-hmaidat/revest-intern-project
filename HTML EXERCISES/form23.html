<html lang="en">

<body>

<form>
    <label for="postal">Postal Code:</label>
    <input type="text"
           id="postal"
           name="postal"
           pattern="[0-9]{5}"
           title="Postal code must contain exactly 5 digits"
           placeholder="inter your code "
           required>

    <br><br>

    <input type="submit" value="Submit">
</form>

</body>
