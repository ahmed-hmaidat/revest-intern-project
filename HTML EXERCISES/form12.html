<!DOCTYPE html>
<html>
<head>
    <title>Salary Form</title>
</head>
<body>

<h2>Salary Input</h2>

<form>
    <label for="salary">Enter your salary:</label>

    <input 
        type="number" 
        id="salary" 
        name="salary" 
        min="300" 
        max="10000"
        placeholder="Pleas enter your salary"
        style="width: 200px"
        required
    >

    <br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
