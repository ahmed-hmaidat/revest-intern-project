<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employee Contact Form</title>
</head>
<body>

<h2>Employee Contact</h2>

<form>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="enter your email"
        required
    >

    <br><br>

    <label for="phone">Phone:</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="you number"
        required
    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
