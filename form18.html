<!DOCTYPE html>
<html lang="en">
<head>
    <title>Multiple Email Addresses</title>
</head>
<body>

<h2>Multiple Email Input</h2>

<form>

    <label for="emails">Email Addresses:</label>
    <input
        type="email"
        id="emails"
        name="emails"
        multiple
        required
        placeholder="enter your email "
    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
