<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Card</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="card">

    <div class="logo">Orange Money</div>

    <div class="icon">
        <img src="../css/assets/credet_carde.svg" >
    </div>

    <div class="number">
        1234 5678 9012 3456
    </div>

    <div class="info">
        <div class="name">
            <small>Card Holder</small><br>
            ANAS HANI
        </div>

        <div class="expiry">
            <small>Expires</small><br>
            12/30
        </div>
    </div>

    <div class="master">
        VISA
    </div>

</div>

</body>
</html>
