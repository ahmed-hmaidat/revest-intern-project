<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3: Media Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .media-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 30px; 
      border: 1px solid #e2e8f0;
      overflow: hidden; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

.media-card__image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 30px 30px 0 0;
  display: block;
}

    .media-card__content {
      padding: 28px; 
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .media-card__category {
      font-size: 13px;
      font-weight: bold;
      color: #2563eb;
      text-transform: uppercase;
    }

    .media-card__title {
      font-size: 20px;
      color: #0f172a;
      line-height: 1.3;
    }

    .media-card__description {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .media-card__button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
      width: 100%;
    }

    .media-card__button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="media-card">
    
    <img 
      src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80" 
      alt="Coding Workspace" 
      class="media-card__image"
    >

    <div class="media-card__content">
      <span class="media-card__category">Technology</span>
      <h3 class="media-card__title">Building Modern Web Applications</h3>
      <p class="media-card__description">
        Learn how to structure your HTML and CSS effectively using clean, responsive layouts and modern styling rules.
      </p>
      <button class="media-card__button">Read Article</button>
    </div>

  </div>

</body>
</html>
