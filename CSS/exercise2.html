<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2: Multipurpose Buttons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 24px;
      color: #1e293b;
    }

    .button-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;

      transition: all 0.2s ease-in-out;
    }

    .btn-rounded {
      border-radius: 8px;
    }
    
    .btn-pill {
      border-radius: 9999px;
    }

    .btn-solid {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-solid:hover {
      background-color: #1d4ed8;
    }

    .btn-soft {
      background-color: #dbeafe;
      color: #1e40af;
    }
    .btn-soft:hover {
      background-color: #bfdbfe;
    }

    .btn-outline {
      background-color: transparent;
      border-color: #2563eb;
      color: #2563eb;
    }
    .btn-outline:hover {
      background-color: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h2>Exercise 2 - Multipurpose Buttons</h2>
  
  <div class="button-wrapper">
    
    <button class="btn btn-rounded btn-solid">Solid Primary</button>
    <button class="btn btn-rounded btn-soft">Soft Secondary</button>
    <button class="btn btn-rounded btn-outline">Outline Tertiary</button>

    <button class="btn btn-pill btn-solid">Solid Primary</button>
    <button class="btn btn-pill btn-soft">Soft Secondary</button>
    <button class="btn btn-pill btn-outline">Outline Tertiary</button>

  </div>

</body>
</html>
