<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Cards</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cards">

    <!-- Light Card -->
    <article class="card light">

        <div class="icon">

            <!-- Chat SVG -->

<img src="../assets/chat_icon.svg">        

        </div>

        <div class="content">

            <h3>Comments</h3>

            <h2>12,450</h2>

            <p class="up">

                ▲ 12.5%

            </p>

        </div>

    </article>



    <!-- Dark Card -->

    <article class="card dark">

        <div class="icon">

            <!-- Trend SVG -->
<img src="../assets/trending_icon.svg">
        </div>

        <div class="content">

            <h3>Revenue</h3>

            <h2>$42,890</h2>

            <p class="up">

                ▲ 18.2%

            </p>

        </div>

    </article>

</div>

</body>
</html>
