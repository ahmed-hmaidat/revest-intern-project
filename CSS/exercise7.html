<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7: Login Form Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .security-badge {
      align-self: flex-start;
      background-color: #ecfdf5;
      color: #059669;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .login-header h2 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 14px;
      color: #64748b;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
    }

    .forgot-link {
      color: #0d9488;
      text-decoration: none;
      font-weight: normal;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-input:focus {
      border-color: #0d9488;
      background-color: #ffffff;
    }

    .input-wrapper .form-input {
      padding-right: 44px;
    }

    .eye-icon {
      position: absolute;
      right: 14px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }

    .checkbox-row input {
      accent-color: #0d9488;
      width: 16px;
      height: 16px;
    }

    .btn-submit {
      background-color: #0d9488; /* نعناعي/زيتي زاهي */
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0f766e;
    }

    .text-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin: 4px 0;
    }

    .text-divider::before,
    .text-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .text-divider span {
      padding: 0 12px;
    }

    .signup-footer {
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .signup-footer a {
      color: #0d9488;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <div class="security-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      SSL secured
    </div>

    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form class="login-form" onsubmit="event.preventDefault();">
      
      <div class="input-group">
        <label class="label-row" for="email">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="alex@example.com" required>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
          <span class="eye-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox">
        <span>Keep me signed in for 30 days</span>
      </label>

      <button type="submit" class="btn-submit">Sign in</button>

    </form>

    <div class="text-divider">
      <span>or continue with</span>
    </div>

    <div class="signup-footer">
      Don't have an account? <a href="#">Create one</a>
    </div>

  </div>

</body>
</html>
