<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4: Text Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .text-card {
      background-color: #ffffff;
      max-width: 400px;
      width: 100%;
      border-radius: 30px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-title {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a; 
    }

    .header-subtitle {
      font-size: 14px;
      color: #64748b;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-solid {
      background-color: #2563eb;
      color: #ffffff;
    }

    .badge-soft {
      background-color: #f1f5f9;
      color: #334155;
    }

    .body-region {
      font-size: 15px;
      line-height: 1.6;
      color: #334155;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="text-card">
    
    <div class="header-stack">
      <h2 class="header-title">Design System Architecture</h2>
      <span class="header-subtitle">Updated 2 hours ago by UI Team</span>
    </div>

    <div class="badge-row">
      <span class="badge badge-solid">Active Sprint</span>
      <span class="badge badge-soft">Frontend</span>
      <span class="badge badge-soft">CSS3</span>
    </div>

    <p class="body-region">
      A robust design system provides a clear typographic hierarchy, consistent spacing tokens, and reusable component patterns to ensure scalability across web applications.
    </p>

  </div>

</body>
</html>
