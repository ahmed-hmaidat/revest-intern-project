<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multipurpose Buttons</title>

    <link rel="stylesheet" href="style3.css">
</head>
<body>

    <div class="buttons">

        <!-- Solid -->
        <button class="btn btn-solid btn-round">
            Primary
        </button>

        <button class="btn btn-solid btn-pill">
            Primary
        </button>

        <!-- Soft -->
        <button class="btn btn-soft btn-round">
            Secondary
        </button>

        <button class="btn btn-soft btn-pill">
            Secondary
        </button>

        <!-- Outline -->
        <button class="btn btn-outline btn-round">
            Tertiary
        </button>

        <button class="btn btn-outline btn-pill">
            Tertiary
        </button>

    </div>

</body>
</html>
