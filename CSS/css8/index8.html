<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>  form user card </title>
        <link rel="stylesheet" href="style8.css">
    </head>
    <body>
        <main class="containar">

            <div class="card-form">

                <div class="upper-slot">
                    <div class="img">
                        <img src="../../css/assets/shild.svg">
                        <div class="pharagraf-img">
                            <p> SSL secured </p>
                        </div>
                    </div>
                    <h4> Welcome back </h4>
                    <p> sign in to Your dashboard to continue. </p>
                </div>


                <div class="medel-slot">
                    <form>
                        <div class="email">
                            <label for="email">Email address</label>
                            <input type="text" name="Email" id="email" required
                            placeholder="you@company.com">
                        </div>

                        <div class="password">
                            <div class="hedar">
                                <p> password</p>
                                <div class="p"><p>forgot password?</p></div>
                            </div>

                           
                            <input type="password" id="password" name="password"
                                minlength="8" required
                                placeholder="Enter your password"><br><br>
                        </div>

                        <div class="checkbox">
                            <label>
                            <input type="checkbox" required>
                             keep me signed in for 30 days
                            </label><br><br>
                        </div>

                        <div class="submit">
                            <input type="submit" value="sign in ">
                        </div>

                    </form>

                    

                </div>


                <div class="lawer-slot">
                 
                    <h6> or continue with</h6>
                
                    
                    <div class="text">
                         <p> Don`t have an account?</p>
                        <div class="p-green"> 
                            <p> Create one free</p>
                         </div>
                         

                    </div>
                   
                </div>

            </div>


        </main>
    </body>
</html>
