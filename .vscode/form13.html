<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quantity Form</title>
</head>
<body>

<h2>Quantity Input</h2>

<form>
    <label for="quantity">Enter quantity:</label>

    <input 
        type="number" 
        id="quantity" 
        name="quantity" 
        min="1" 
        max="50"
        placeholder="++"
        required

    >

    <br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
