<!DOCTYPE html>
<html lang="en">
<head>
    <title>Even Number</title>
</head>
<body>

<h2>Even Number Input</h2>

<form>

    <label for="number">Enter an even number:</label>

    <input 
        type="number" 
        id="number" 
        name="number" 
        step="2"
        placeholder="Even Pleas"
        required
    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
