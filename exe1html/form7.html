<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student ID</title>
</head>
<body>

    <h2>Student ID Form</h2>

    <form>

        <label for="studentid">Student ID:</label><br>

        <input type="text"
               id="studentid"
               name="studentid"
               minlength="8"
               maxlength="8"
               placeholder="Pleas enter your id"
               required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</body>
</html>
