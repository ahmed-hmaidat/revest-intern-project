<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Website Form</title>
</head>
<body>

<h2>Company Information</h2>

<form>

    <label for="company">Company Name:</label>
    <input 
        type="text" 
        id="company" 
        name="company"
        required
        placeholder="your company"
    >

    <br><br>

    <label for="website">Website:</label>
    <input 
        type="url" 
        id="website" 
        name="website"
        required
        placeholder="Website"

    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
