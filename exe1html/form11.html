<!DOCTYPE html>
<html lang="en">
<head>
    <title>Age Form</title>
</head>
<body>

<h2>Age Input</h2>

<form>
    <label for="age">Enter your age:</label>
    <input 
        type="number" 
        id="age" 
        name="age" 
        min="18" 
        max="65"
        placeholder="+18"
    >

    <br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
