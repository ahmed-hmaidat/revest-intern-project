<!DOCTYPE html>
<html lang="en">
<head>
    <title>Multiples of 10</title>
</head>
<body>

<h2>Multiples of 10 Input</h2>

<form>

    <label for="number">Enter a multiple of 10:</label>

    <input 
        type="number" 
        id="number" 
        name="number" 
        min="10"
        step="10"
        required
        placeholder="x10"
    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
