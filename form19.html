<!DOCTYPE html>
<html lang="en">
<head>
    <title>Social Profile Form</title>
</head>
<body>

<h2>Social Profiles</h2>

<form>

    <label for="github">GitHub URL:</label>
    <input
        type="url"
        id="github"
        name="github"
        required
        placeholder="Enter oyur github"
    >

    <br><br>

    <label for="linkedin">LinkedIn URL:</label>
    <input
        type="url"
        id="linkedin"
        name="linkedin"
        required
        placeholder="Enter your linkedin"
    >

    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
